<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="实时计算你的工资收入，每秒都能看到钱在增长！">
    <title>💰 实时工资计算器 - 每秒都在赚钱</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&family=Roboto+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f0f 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #ffd700 0%, #ffed4e 50%, transparent 70%);
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0.6;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }
        
        .container {
            position: relative;
            z-index: 10;
            max-width: 100%;
            margin: 0 auto;
            padding: 15px;
            padding-bottom: 100px;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(90deg, #ffd700, #ffed4e, #ffd700, #b8860b, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            letter-spacing: 1px;
        }
        
        @keyframes shine {
            to { background-position: 200% center; }
        }
        
        .sound-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            font-size: 0.8rem;
        }
        
        .sound-toggle.inactive {
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.1);
        }
        
        .sound-icon {
            font-size: 1.2rem;
        }
        
        .sound-text {
            font-weight: 700;
            color: #00ff88;
        }
        
        .sound-toggle.inactive .sound-text {
            color: #ffd700;
        }
        
        .input-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #ffd700;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: #ffd700;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            min-width: 80px;
        }
        
        .btn-start {
            background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700);
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }
        
        .btn-stop {
            background: rgba(255, 255, 255, 0.1);
            color: #ffd700;
            border: 2px solid #ffd700;
        }
        
        .btn-reset {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 2px solid #ff4444;
        }
        
        .main-display {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(184, 134, 11, 0.1) 100%);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2);
            margin-bottom: 15px;
        }
        
        .main-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 215, 0, 0.15), transparent 30%);
            animation: rotate 8s linear infinite;
        }
        
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
        
        .hourglass-section {
            position: relative;
            z-index: 2;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .hourglass-container {
            position: relative;
            width: 60px;
            height: 90px;
        }
        
        .hourglass-top, .hourglass-bottom {
            width: 45px;
            height: 38px;
            border: 2px solid rgba(255, 215, 0, 0.6);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .hourglass-top {
            top: 0;
            border-radius: 5px 5px 25px 25px;
            border-bottom: none;
        }
        
        .hourglass-bottom {
            bottom: 0;
            border-radius: 25px 25px 5px 5px;
            border-top: none;
        }
        
        .sand-top, .sand-bottom {
            position: absolute;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #ffd700, #ffed4e);
            transition: all 1s linear;
        }
        
        .sand-top {
            bottom: 0;
            height: 70%;
        }
        
        .sand-bottom {
            bottom: 0;
            height: 0%;
        }
        
        .sand-stream {
            position: absolute;
            left: 50%;
            top: 38px;
            width: 2px;
            height: 14px;
            background: linear-gradient(180deg, #ffd700, transparent);
            transform: translateX(-50%);
            opacity: 0.8;
            animation: sandFall 1s infinite;
        }
        
        @keyframes sandFall {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }
        
        .time-info {
            text-align: left;
        }
        
        .time-label {
            font-size: 0.8rem;
            color: rgba(255, 215, 0, 0.7);
            margin-bottom: 3px;
        }
        
        .time-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.4rem;
            color: #ffd700;
            font-weight: 700;
        }
        
        .total-display {
            position: relative;
            z-index: 2;
            margin-bottom: 20px;
        }
        
        .total-label {
            font-size: 1rem;
            color: rgba(255, 215, 0, 0.9);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }
        
        .total-amount-wrapper {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            position: relative;
        }
        
        .currency-symbol {
            font-size: 3rem;
            color: #ffd700;
            font-weight: 900;
            margin-right: 5px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: symbolPulse 2s ease-in-out infinite;
        }
        
        @keyframes symbolPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .total-amount {
            font-family: 'Orbitron', 'Roboto Mono', monospace;
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, #ffd700 30%, #ffed4e 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            line-height: 1;
            letter-spacing: -3px;
        }
        
        .total-amount.pulse {
            animation: bigPulse 0.5s ease;
        }
        
        @keyframes bigPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        .decimal-part {
            font-size: 3rem;
        }
        
        .per-second-display {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 10px 20px;
            display: inline-block;
            border: 1px solid rgba(255, 215, 0, 0.3);
            margin-bottom: 20px;
        }
        
        .per-second-label {
            font-size: 0.75rem;
            color: rgba(255, 215, 0, 0.7);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .per-second-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: #00ff88;
            font-weight: 700;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            position: relative;
            z-index: 2;
        }
        
        .stat-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
        }
        
        .stat-card .label {
            font-size: 0.7rem;
            color: rgba(255, 215, 0, 0.6);
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: #ffd700;
            font-weight: 700;
        }
        
        .progress-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #b8860b, #ffd700, #ffed4e, #ffd700, #b8860b);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.8rem;
            color: rgba(255, 215, 0, 0.9);
        }
        
        .daily-history-section {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1) 0%, rgba(0, 204, 106, 0.05) 100%);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 20px;
            padding: 20px 15px;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .daily-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }
        
        .daily-history-title {
            font-size: 1.1rem;
            color: #00ff88;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .btn-clear-history {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 2px solid #ff4444;
            padding: 8px 15px;
            font-size: 0.75rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
        }
        
        .daily-total-display {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }
        
        .daily-total-label {
            font-size: 0.85rem;
            color: rgba(0, 255, 136, 0.8);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .daily-total-amount {
            font-family: 'Orbitron', 'Roboto Mono', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }
        
        .daily-total-amount .currency {
            font-size: 1.5rem;
            margin-right: 3px;
        }
        
        .daily-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }
        
        .daily-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        
        .daily-item-time {
            font-family: 'Roboto Mono', monospace;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .daily-item-amount {
            font-family: 'Orbitron', sans-serif;
            color: #00ff88;
            font-weight: 700;
        }
        
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
        }
        
        .coin-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1500;
            overflow: hidden;
        }
        
        .coin {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #ffed4e, #ffd700, #b8860b);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #b8860b;
            font-size: 20px;
            animation: coinFall 3s ease-out forwards;
        }
        
        .coin::before {
            content: '¥';
        }
        
        @keyframes coinFall {
            0% {
                transform: translateY(-100px) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(0) rotate(360deg) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }
        
        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
            animation: blink 1s infinite;
        }
        
        .status.active {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .status.inactive {
            background: #ff4444;
            box-shadow: 0 0 8px #ff4444;
            animation: none;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <canvas id="fireworksCanvas"></canvas>
    <div class="coin-container" id="coinContainer"></div>
    
    <div class="container">
        <div class="top-bar">
            <div class="header">
                <h1>💰 实时工资计算器</h1>
            </div>
            <div class="sound-toggle" id="soundToggle" onclick="toggleSound()">
                <span class="sound-icon" id="soundIcon">🔊</span>
                <span class="sound-text" id="soundText">开启</span>
            </div>
        </div>
        
        <div class="input-section">
            <div class="input-grid">
                <div class="input-group">
                    <label>💵 月薪</label>
                    <input type="number" id="salary" placeholder="15000" value="15000">
                </div>
                <div class="input-group">
                    <label>🕐 上班</label>
                    <input type="time" id="startTime" value="09:00">
                </div>
                <div class="input-group">
                    <label>🏠 下班</label>
                    <input type="time" id="endTime" value="18:00">
                </div>
                <div class="input-group">
                    <label>📅 天数</label>
                    <input type="number" id="workDays" placeholder="22" value="22">
                </div>
            </div>
            
            <div class="controls">
                <button class="btn btn-start" onclick="startCalculation()">
                    <span class="status inactive" id="statusIndicator"></span>
                    开始
                </button>
                <button class="btn btn-stop" onclick="stopCalculation()">暂停</button>
                <button class="btn btn-reset" onclick="resetCurrent()">清零</button>
            </div>
        </div>
        
        <div class="main-display">
            <div class="hourglass-section">
                <div class="hourglass-container">
                    <div class="hourglass">
                        <div class="hourglass-top">
                            <div class="sand-top" id="sandTop"></div>
                        </div>
                        <div class="sand-stream"></div>
                        <div class="hourglass-bottom">
                            <div class="sand-bottom" id="sandBottom"></div>
                        </div>
                    </div>
                </div>
                <div class="time-info">
                    <div class="time-label">已工作时间</div>
                    <div class="time-value" id="workedTime">00:00:00</div>
                </div>
            </div>
            
            <div class="total-display">
                <div class="total-label">⚡ 今日实时累计收入 ⚡</div>
                <div class="total-amount-wrapper">
                    <span class="currency-symbol">¥</span>
                    <span class="total-amount" id="totalAmount">
                        <span id="integerPart">0</span>
                        <span class="decimal-part">.<span id="decimalPart">00</span></span>
                    </span>
                </div>
            </div>
            
            <div class="per-second-display">
                <div class="per-second-label">每秒赚取</div>
                <div class="per-second-amount" id="perSecondSmall">+¥0.0000</div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="label">每分钟</div>
                    <div class="value" id="perMinute">¥0.00</div>
                </div>
                <div class="stat-card">
                    <div class="label">每小时</div>
                    <div class="value" id="perHour">¥0.00</div>
                </div>
                <div class="stat-card">
                    <div class="label">预计今日</div>
                    <div class="value" id="dailyTotal">¥0.00</div>
                </div>
            </div>
            
            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-info">
                    <span id="workStart">09:00</span>
                    <span id="progressText">0%</span>
                    <span id="workEnd">18:00</span>
                </div>
            </div>
        </div>
        
        <div class="daily-history-section">
            <div class="daily-history-header">
                <div class="daily-history-title">📊 历史记录</div>
                <button class="btn-clear-history" onclick="clearHistory()">清空</button>
            </div>
            
            <div class="daily-total-display">
                <div class="daily-total-label">累计总收入</div>
                <div class="daily-total-amount">
                    <span class="currency">¥</span>
                    <span id="historyTotal">0.00</span>
                </div>
            </div>
            
            <div class="daily-list" id="dailyList">
                <div class="daily-item" style="justify-content: center; color: rgba(255,255,255,0.5);">
                    暂无记录
                </div>
            </div>
        </div>
    </div>

    <script>
        let intervalId = null;
        let earningsPerSecond = 0;
        let currentEarnings = 0;
        let lastMilestone = 0;
        let isRunning = false;
        let soundEnabled = true;
        let audioContext = null;
        let lastSecond = -1;
        let dailyRecords = [];
        
        function loadHistory() {
            const saved = localStorage.getItem('salaryRecords');
            if (saved) {
                dailyRecords = JSON.parse(saved);
                updateHistoryDisplay();
            }
        }
        
        function saveHistory() {
            localStorage.setItem('salaryRecords', JSON.stringify(dailyRecords));
        }
        
        function updateHistoryDisplay() {
            const listEl = document.getElementById('dailyList');
            const totalEl = document.getElementById('historyTotal');
            
            const total = dailyRecords.reduce((sum, record) => sum + record.amount, 0);
            totalEl.textContent = total.toFixed(2);
            
            if (dailyRecords.length === 0) {
                listEl.innerHTML = '<div class="daily-item" style="justify-content: center; color: rgba(255,255,255,0.5);">暂无记录</div>';
            } else {
                listEl.innerHTML = dailyRecords.slice().reverse().map(record => `
                    <div class="daily-item">
                        <span class="daily-item-time">${record.date} ${record.time}</span>
                        <span class="daily-item-amount">¥${record.amount.toFixed(2)}</span>
                    </div>
                `).join('');
            }
        }
        
        function addRecord(amount) {
            const now = new Date();
            const record = {
                date: now.toLocaleDateString('zh-CN'),
                time: now.toLocaleTimeString('zh-CN', { hour12: false }),
                amount: amount,
                timestamp: now.getTime()
            };
            dailyRecords.push(record);
            saveHistory();
            updateHistoryDisplay();
        }
        
        function resetCurrent() {
            if (currentEarnings > 0) {
                addRecord(currentEarnings);
                if (soundEnabled && audioContext) {
                    playCoinSound(0.2);
                }
            }
            
            stopCalculation();
            
            currentEarnings = 0;
            lastMilestone = 0;
            lastSecond = -1;
            
            document.getElementById('integerPart').textContent = '0';
            document.getElementById('decimalPart').textContent = '00';
            document.getElementById('workedTime').textContent = '00:00:00';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressText').textContent = '0%';
            document.getElementById('sandTop').style.height = '100%';
            document.getElementById('sandBottom').style.height = '0%';
        }
        
        function clearHistory() {
            if (confirm('确定清空所有历史记录？')) {
                dailyRecords = [];
                saveHistory();
                updateHistoryDisplay();
                if (soundEnabled && audioContext) {
                    playCoinSound(0.1);
                }
            }
        }
        
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let fireworks = [];
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        class Firework {
            constructor(x, y, targetY) {
                this.x = x;
                this.y = y;
                this.targetY = targetY;
                this.speed = 8;
                this.angle = -Math.PI / 2;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.hue = Math.random() * 60 + 30;
                this.brightness = Math.random() * 30 + 50;
                this.alpha = 1;
                this.dead = false;
                this.trail = [];
            }
            
            update() {
                this.trail.push({x: this.x, y: this.y, alpha: this.alpha});
                if (this.trail.length > 10) this.trail.shift();
                
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15;
                
                if (this.vy >= 0 || this.y <= this.targetY) {
                    this.dead = true;
                    createExplosion(this.x, this.y, this.hue);
                }
            }
            
            draw() {
                ctx.save();
                this.trail.forEach((point, index) => {
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${point.alpha * (index / 10)})`;
                    ctx.fill();
                });
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 1)`;
                ctx.fill();
                ctx.restore();
            }
        }
        
        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.hue = hue + Math.random() * 30 - 15;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.friction = 0.95;
                this.gravity = 0.2;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.brightness = Math.random() * 30 + 50;
                this.size = Math.random() * 3 + 2;
            }
            
            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, 1)`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 1)`;
                ctx.fill();
                ctx.restore();
            }
        }
        
        function createExplosion(x, y, hue) {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y, hue));
            }
        }
        
        function launchFirework() {
            const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
            const targetY = Math.random() * canvas.height * 0.4 + 50;
            fireworks.push(new Firework(x, canvas.height, targetY));
        }
        
        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fireworks = fireworks.filter(fw => !fw.dead);
            particles = particles.filter(p => p.alpha > 0);
            fireworks.forEach(fw => { fw.update(); fw.draw(); });
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();
        
        function playFireworkSound() {
            if (!soundEnabled || !audioContext) return;
            const now = audioContext.currentTime;
            
            const bufferSize = audioContext.sampleRate * 0.5;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, now);
            filter.frequency.exponentialRampToValueAtTime(100, now + 0.5);
            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioContext.destination);
            noise.start(now);
        }
        
        function celebrateMilestone() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    launchFirework();
                    playFireworkSound();
                }, i * 300);
            }
            
            const text = document.createElement('div');
            text.style.cssText = `
                position: fixed;
                top: 40%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0);
                font-family: Orbitron, sans-serif;
                font-size: 4rem;
                font-weight: 900;
                color: #ffd700;
                text-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
                z-index: 3000;
                pointer-events: none;
                animation: textPop 2s ease forwards;
            `;
            text.textContent = `¥${lastMilestone}`;
            document.body.appendChild(text);
            
            setTimeout(() => text.remove(), 2000);
            dropCoins();
        }
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const toggle = document.getElementById('soundToggle');
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            
            if (soundEnabled) {
                initAudio();
                toggle.classList.remove('inactive');
                icon.textContent = '🔊';
                text.textContent = '开启';
                text.style.color = '#00ff88';
                playCoinSound(0.1);
            } else {
                toggle.classList.add('inactive');
                icon.textContent = '🔇';
                text.textContent = '关闭';
                text.style.color = '#ffd700';
            }
        }
        
        function playCoinSound(volume = 0.3) {
            if (!soundEnabled || !audioContext) return;
            
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const osc = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    const filter = audioContext.createBiquadFilter();
                    
                    osc.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    osc.frequency.setValueAtTime(1200 + Math.random() * 800, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.1);
                    
                    filter.type = 'highpass';
                    filter.frequency.value = 2000;
                    filter.Q.value = 10;
                    
                    gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                    
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.15);
                }, i * 50);
            }
        }
        
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                container.appendChild(particle);
            }
        }
        
        function dropCoins() {
            const container = document.getElementById('coinContainer');
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const coin = document.createElement('div');
                    coin.className = 'coin';
                    coin.style.left = Math.random() * 100 + '%';
                    coin.style.animationDuration = (2 + Math.random()) + 's';
                    container.appendChild(coin);
                    setTimeout(() => coin.remove(), 3000);
                }, i * 80);
            }
            playCoinSound(0.4);
        }
        
        function calculateSalary() {
            const salary = parseFloat(document.getElementById('salary').value) || 0;
            const workDays = parseFloat(document.getElementById('workDays').value) || 22;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            
            const [startHour, startMin] = startTime.split(':').map(Number);
            const [endHour, endMin] = endTime.split(':').map(Number);
            
            let workHours = (endHour + endMin/60) - (startHour + startMin/60);
            if (workHours < 0) workHours += 24;
            
            const dailySalary = salary / workDays;
            earningsPerSecond = dailySalary / (workHours * 3600);
            
            document.getElementById('perSecondSmall').textContent = '+¥' + earningsPerSecond.toFixed(4);
            document.getElementById('perMinute').textContent = '¥' + (earningsPerSecond * 60).toFixed(2);
            document.getElementById('perHour').textContent = '¥' + (earningsPerSecond * 3600).toFixed(2);
            document.getElementById('dailyTotal').textContent = '¥' + dailySalary.toFixed(2);
            document.getElementById('workStart').textContent = startTime;
            document.getElementById('workEnd').textContent = endTime;
            
            return { startHour, startMin, endHour, endMin, workHours, dailySalary };
        }
        
        function formatTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        
        function updateDisplay() {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMin = now.getMinutes();
            const currentSec = now.getSeconds();
            const currentMs = now.getMilliseconds();
            
            const { startHour, startMin, endHour, endMin, workHours, dailySalary } = calculateSalary();
            const startTimeVal = startHour + startMin/60;
            const endTimeVal = endHour + endMin/60;
            const currentTime = currentHour + currentMin/60 + currentSec/3600 + currentMs/3600000;
            
            let workedSeconds = 0;
            let progress = 0;
            
            if (currentTime >= startTimeVal && currentTime <= endTimeVal) {
                workedSeconds = (currentTime - startTimeVal) * 3600;
                currentEarnings = workedSeconds * earningsPerSecond;
                progress = ((currentTime - startTimeVal) / workHours) * 100;
                document.getElementById('progressText').textContent = Math.min(progress, 100).toFixed(0) + '%';
            } else if (currentTime > endTimeVal) {
                workedSeconds = workHours * 3600;
                currentEarnings = dailySalary;
                progress = 100;
                document.getElementById('progressText').textContent = '完成';
            } else {
                workedSeconds = 0;
                currentEarnings = 0;
                progress = 0;
                document.getElementById('progressText').textContent = '未开始';
            }
            
            const sandTop = document.getElementById('sandTop');
            const sandBottom = document.getElementById('sandBottom');
            const sandPercent = Math.min((workedSeconds / (workHours * 3600)) * 100, 100);
            sandTop.style.height = (100 - sandPercent) + '%';
            sandBottom.style.height = sandPercent + '%';
            
            document.getElementById('workedTime').textContent = formatTime(workedSeconds);
            document.getElementById('progressFill').style.width = progress + '%';
            
            const formatted = currentEarnings.toFixed(2);
            const [intPart, decPart] = formatted.split('.');
            
            document.getElementById('integerPart').textContent = intPart;
            document.getElementById('decimalPart').textContent = decPart;
            
            if (currentSec !== lastSecond) {
                lastSecond = currentSec;
                const totalEl = document.getElementById('totalAmount');
                totalEl.classList.remove('pulse');
                void totalEl.offsetWidth;
                totalEl.classList.add('pulse');
                
                if (isRunning && soundEnabled && audioContext) {
                    playCoinSound(0.05);
                }
            }
            
            const milestone = Math.floor(currentEarnings / 10) * 10;
            if (milestone > lastMilestone && milestone > 0) {
                lastMilestone = milestone;
                celebrateMilestone();
            }
        }
        
        function startCalculation() {
            if (isRunning) return;
            
            isRunning = true;
            document.getElementById('statusIndicator').classList.remove('inactive');
            document.getElementById('statusIndicator').classList.add('active');
            
            initAudio();
            calculateSalary();
            updateDisplay();
            
            intervalId = setInterval(updateDisplay, 50);
        }
        
        function stopCalculation() {
            isRunning = false;
            document.getElementById('statusIndicator').classList.remove('active');
            document.getElementById('statusIndicator').classList.add('inactive');
            
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }
        
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', () => {
                calculateSalary();
                if (isRunning) updateDisplay();
            });
        });
        
        window.addEventListener('load', () => {
            createParticles();
            calculateSalary();
            loadHistory();
            
            document.body.addEventListener('click', function initAudioOnFirstClick() {
                if (soundEnabled && !audioContext) {
                    initAudio();
                }
                document.body.removeEventListener('click', initAudioOnFirstClick);
            }, { once: true });
        });
    </script>
</body>
